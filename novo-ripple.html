<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIPPLE — The Waiting Game</title>
<style>
  :root{
    --bg:#1B6BDC; --bg2:#1257BE; --blue:#001965; --tint:#B1D5F2; --magenta:#C6007E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Apis','Source Sans 3','Segoe UI',system-ui,sans-serif;
    background:radial-gradient(120% 120% at 50% 42%, var(--bg) 0%, #1660CC 55%, var(--bg2) 100%);
    color:#fff;overflow:hidden;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }

  /* ---------- header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:10;
    padding:18px 22px 0;text-align:center;pointer-events:none;
  }
  .eyebrow{font-size:10px;letter-spacing:3.5px;font-weight:700;color:rgba(255,255,255,.75);}
  #score{
    font-size:44px;font-weight:800;line-height:1.05;margin-top:6px;
    text-shadow:0 2px 20px rgba(0,25,101,.35);font-variant-numeric:tabular-nums;
  }
  .scoreLbl{font-size:10.5px;letter-spacing:4px;font-weight:700;color:rgba(255,255,255,.8);margin-top:2px;}
  #hint{
    margin-top:10px;font-size:12.5px;font-style:italic;font-weight:600;
    color:rgba(255,255,255,.85);transition:opacity .4s;padding:0 24px;
  }

  /* ---------- world ---------- */
  #world{position:absolute;inset:0;overflow:hidden;}
  .standing{
    position:absolute;left:var(--cx);top:var(--cy);translate:-50% -50%;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side, rgba(255,255,255,var(--o,.05)) 0 97.5%, rgba(255,255,255,0) 100%);
    animation:standPulse 7s ease-in-out infinite;
  }
  @keyframes standPulse{0%,100%{opacity:.85;}50%{opacity:1;}}

  #bull{
    position:absolute;left:var(--cx);top:var(--cy);
    width:min(64vmin,560px);translate:-33% -7%;
    opacity:.22;pointer-events:none;
    clip-path:inset(0 0 34% 0);   /* bull only — hide the wordmark */
  }

  #disc{
    position:absolute;left:var(--cx);top:var(--cy);translate:-50% -50%;z-index:5;
    width:min(24vmin,190px);aspect-ratio:1;border-radius:50%;cursor:pointer;
    border:min(5.2vmin,40px) solid #fff;background:transparent;
    box-shadow:0 0 50px rgba(255,255,255,.35), inset 0 0 30px rgba(255,255,255,.25);
    transition:transform .08s ease;
    animation:discBreathe 3.6s ease-in-out infinite;
  }
  #disc.squish{transform:scale(.93);}
  @keyframes discBreathe{
    0%,100%{box-shadow:0 0 50px rgba(255,255,255,.35), inset 0 0 30px rgba(255,255,255,.25);}
    50%{box-shadow:0 0 80px rgba(255,255,255,.55), inset 0 0 40px rgba(255,255,255,.4);}
  }

  .ripple{
    position:absolute;left:var(--cx);top:var(--cy);translate:-50% -50%;z-index:3;
    width:min(24vmin,190px);aspect-ratio:1;border-radius:50%;pointer-events:none;
    border:3px solid rgba(255,255,255,.65);
    box-shadow:0 0 24px rgba(255,255,255,.35), inset 0 0 24px rgba(255,255,255,.2);
    animation:rip 2.1s cubic-bezier(.16,.6,.4,1) forwards;
  }
  @keyframes rip{
    from{transform:scale(1);opacity:1;}
    to{transform:scale(13);opacity:0;}
  }
  .floatUp{
    position:absolute;z-index:8;font-weight:800;font-size:19px;color:#fff;pointer-events:none;
    text-shadow:0 2px 12px rgba(0,25,101,.6);
    animation:riseUp 1s ease-out forwards;
  }
  @keyframes riseUp{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-64px);}}

  /* ---------- footer ---------- */
  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    padding:0 18px calc(16px + env(safe-area-inset-bottom));
    display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
    pointer-events:none;
  }
  #claim{
    font-size:11px;letter-spacing:2.5px;font-weight:700;line-height:1.7;
    color:rgba(255,255,255,.9);
  }
  #claim b{color:#fff;}
  footer img{width:84px;opacity:.95;}

  #banner{
    position:fixed;left:50%;top:20%;translate:-50% 0;z-index:55;display:none;
    font-size:25px;font-weight:800;text-align:center;pointer-events:none;color:#fff;
    text-shadow:0 2px 16px rgba(0,25,101,.7);width:90%;
    animation:bannerUp 3.4s ease-out forwards;
  }
  @keyframes bannerUp{
    0%{opacity:0;transform:translateY(10px);}
    8%,75%{opacity:1;transform:translateY(0);}
    100%{opacity:0;transform:translateY(-26px);}
  }
  #banner .sub{font-size:14px;font-weight:600;}

  @media (max-width:600px){
    #score{font-size:38px;}
    footer img{width:70px;}
    #claim{font-size:9.5px;letter-spacing:2px;}
  }
  @media (prefers-reduced-motion:reduce){
    .ripple{animation-duration:.6s;}
    .standing,#disc{animation:none;}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">NOVO NORDISK · GAMESCOM 2026</div>
  <div id="score">0</div>
  <div class="scoreLbl">RIPPLES</div>
  <div id="hint">Tap the circle. See what one small action can do.</div>
</header>

<div id="world">
  <img id="bull" src="assets/novo-bull-white.png" alt="">
  <div id="disc"></div>
</div>

<footer>
  <div id="claim">SOME THINGS ARE WORTH THE WAIT.<br><b>YOUR HEALTH ISN&rsquo;T.</b></div>
  <img src="assets/novo-logo-white.png" alt="Novo Nordisk">
</footer>

<div id="banner"></div>

<script>
(() => {
'use strict';

const SAVE_KEY='novo-ripple-v1';
const HINTS=[
  'Tap the circle. See what one small action can do.',
  'Every ripple starts the same way: one tap.',
  'Small actions add up. That is the whole secret.',
  "Some things are worth the wait. Your health isn't.",
  'Keep going. The water remembers.',
  'One glass of water. One stretch. One tap.',
];
const MILESTONES=[
  {at:10,   line:'10 ripples — one small action at a time.'},
  {at:25,   line:'25 ripples — it is becoming a rhythm.'},
  {at:50,   line:'50 ripples — the pool is moving.'},
  {at:100,  line:'100 ripples — your ripples now continue on their own.', auto:true},
  {at:250,  line:'250 ripples — small actions, visible response.'},
  {at:500,  line:'500 ripples — the whole queue can see this.'},
  {at:1000, line:'1,000 ripples — you started with one tap.'},
];

let S={n:0, seen:0};
try{
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw){const p=JSON.parse(raw); if(p&&typeof p.n==='number') S=Object.assign(S,p);}
}catch(e){}

/* center of the disc — slightly above middle, like the reference frame */
const CX='50%', CY='44%';
document.documentElement.style.setProperty('--cx',CX);
document.documentElement.style.setProperty('--cy',CY);
[...document.querySelectorAll('#disc,#bull')].forEach(el=>{el.style.setProperty('--cx',CX);el.style.setProperty('--cy',CY);});

const $=id=>document.getElementById(id);
const world=$('world'), disc=$('disc'), score=$('score'), hint=$('hint'), banner=$('banner');

/* ---------- standing rings (the world remembers your ripples) ---------- */
function standingCount(){ return Math.min(3 + MILESTONES.filter(m=>S.n>=m.at).length, 10); }
function renderStanding(){
  [...world.querySelectorAll('.standing')].forEach(e=>e.remove());
  const n=standingCount();
  for(let i=0;i<n;i++){
    const d=document.createElement('div');
    d.className='standing';
    const size=(40+i*32);
    d.style.width=size+'vmin'; d.style.height=size+'vmin';
    d.style.setProperty('--cx',CX); d.style.setProperty('--cy',CY);
    d.style.setProperty('--o',(0.055-i*0.002).toFixed(3));
    d.style.animationDelay=(i*0.7)+'s';
    world.insertBefore(d, world.firstChild);
  }
}

/* ---------- audio: soft pentatonic drops ---------- */
let AC=null, combo=0, comboAt=0;
const TONES=[392,440,494,587,659,784,880];
function pluck(f){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.10,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.5);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.5);
  }catch(e){}
}

/* ---------- ripple ---------- */
let autoOn=false, autoTimer=null;
function ripple(counted, manual){
  const r=document.createElement('div');
  r.className='ripple';
  r.style.setProperty('--cx',CX); r.style.setProperty('--cy',CY);
  world.appendChild(r);
  setTimeout(()=>r.remove(),2200);
  if(!counted) return;
  S.n++;
  score.textContent=S.n.toLocaleString('en-US');
  if(manual){
    const now=Date.now();
    combo = now-comboAt<1600 ? Math.min(combo+1,TONES.length-1) : 0;
    comboAt=now;
    pluck(TONES[combo]);
    if(navigator.vibrate) navigator.vibrate(8);
  }else{
    pluck(TONES[0]);
  }
  checkMilestones();
  save();
}
disc.addEventListener('pointerdown', e=>{
  e.preventDefault();
  disc.classList.add('squish'); setTimeout(()=>disc.classList.remove('squish'),80);
  const f=document.createElement('div');
  f.className='floatUp'; f.textContent='+1';
  f.style.left=e.clientX+'px'; f.style.top=(e.clientY-30)+'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(),1000);
  ripple(true, true);
});

/* ---------- milestones ---------- */
let toasted=[];
function checkMilestones(){
  for(const m of MILESTONES){
    if(S.n>=m.at && !toasted.includes(m.at)){
      toasted.push(m.at);
      if(S.n===m.at){
        showBanner(m.at.toLocaleString('en-US')+' RIPPLES<br><span class="sub">'+m.line+'</span>');
        pluck(TONES[4]); setTimeout(()=>pluck(TONES[6]),140);
        if(navigator.vibrate) navigator.vibrate([12,40,12]);
      }
      renderStanding();
      if(m.auto) startAuto();
    }
  }
}
function startAuto(){
  if(autoOn) return;
  autoOn=true;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  autoTimer=setInterval(()=>{ if(!document.hidden) ripple(true,false); },4200);
}

let bannerTimer=0;
function showBanner(html){
  banner.innerHTML=html; banner.style.display='block';
  banner.style.animation='none'; void banner.offsetWidth; banner.style.animation='';
  clearTimeout(bannerTimer);
  bannerTimer=setTimeout(()=>{banner.style.display='none';},3300);
}

/* ---------- hints ---------- */
let hintI=0;
setInterval(()=>{
  hint.style.opacity=0;
  setTimeout(()=>{ hintI=(hintI+1)%HINTS.length; hint.textContent=HINTS[hintI]; hint.style.opacity=1; },400);
},8000);

/* ---------- boot ---------- */
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({n:S.n,seen:Date.now()})); }catch(e){}
}
addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });

score.textContent=S.n.toLocaleString('en-US');
toasted=MILESTONES.filter(m=>S.n>=m.at).map(m=>m.at);
renderStanding();
if(S.n>=100) startAuto();
/* a welcoming ripple so the screen is alive before the first tap */
setTimeout(()=>ripple(false,false),600);
setTimeout(()=>ripple(false,false),1400);
})();
</script>
</body>
</html>
