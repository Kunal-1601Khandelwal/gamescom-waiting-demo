<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ORB CLICKER — Waiting</title>
<style>
  :root{
    --blue:#001965; --lblue:#3B97DE; --tint1:#E2F0FA; --tint2:#B1D5F2;
    --magenta:#C6007E; --white:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--blue);
    font-family:'Apis','Source Sans 3','Segoe UI',system-ui,sans-serif;
    color:var(--white);
    display:flex;flex-direction:column;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }

  /* ---------- header ---------- */
  header{
    padding:14px 18px 8px;
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .hTitle{font-size:15px;font-weight:700;letter-spacing:3px;color:var(--tint2);}
  .hSub{font-size:10px;letter-spacing:1.5px;color:var(--lblue);margin-top:2px;}
  .cps{
    font-size:11px;color:var(--tint2);text-align:right;letter-spacing:.5px;
  }
  .cps b{color:#fff;font-size:13px;}

  /* ---------- score ---------- */
  .scoreWrap{text-align:center;padding:2px 0 0;}
  #score{
    font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 30px rgba(59,151,222,.55);
  }
  .scoreLbl{font-size:11px;letter-spacing:3px;color:var(--lblue);margin-top:4px;}

  /* ---------- orb stage ---------- */
  .stage{
    flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    min-height:0;
  }
  canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  #orb{
    width:min(46vw,210px);height:min(46vw,210px);
    border-radius:50%;
    position:relative;cursor:pointer;
    background:radial-gradient(circle at 34% 30%, #9fd0f5 0%, var(--lblue) 38%, #1565b8 72%, #0c3f86 100%);
    box-shadow:
      0 0 60px rgba(59,151,222,.5),
      0 0 120px rgba(59,151,222,.25),
      inset 0 -14px 34px rgba(0,25,101,.55),
      inset 0 10px 26px rgba(255,255,255,.35);
    transition:transform .08s ease;
    animation:breathe 3.2s ease-in-out infinite;
  }
  #orb.squish{transform:scale(.92);}
  @keyframes breathe{
    0%,100%{box-shadow:0 0 60px rgba(59,151,222,.5),0 0 120px rgba(59,151,222,.25),inset 0 -14px 34px rgba(0,25,101,.55),inset 0 10px 26px rgba(255,255,255,.35);}
    50%{box-shadow:0 0 85px rgba(59,151,222,.75),0 0 150px rgba(59,151,222,.35),inset 0 -14px 34px rgba(0,25,101,.55),inset 0 10px 26px rgba(255,255,255,.35);}
  }
  #orb::after{ /* sheen */
    content:'';position:absolute;left:16%;top:10%;width:34%;height:22%;
    border-radius:50%;background:rgba(255,255,255,.5);filter:blur(6px);
    transform:rotate(-18deg);
  }
  .float{
    position:absolute;font-weight:800;font-size:22px;color:#fff;
    pointer-events:none;text-shadow:0 2px 8px rgba(0,25,101,.8);
    animation:rise .9s ease-out forwards;
  }
  .float.bonus{color:var(--magenta);}
  @keyframes rise{
    from{opacity:1;transform:translateY(0) scale(1);}
    to{opacity:0;transform:translateY(-70px) scale(1.25);}
  }

  /* ---------- shop ---------- */
  .shop{
    padding:6px 12px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;
  }
  .shopLbl{font-size:10px;letter-spacing:3px;color:var(--lblue);padding-left:6px;}
  .items{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .items::-webkit-scrollbar{display:none;}
  .item{
    flex:0 0 128px;background:rgba(255,255,255,.07);
    border:1px solid rgba(177,213,242,.25);
    border-radius:16px;padding:10px 12px;cursor:pointer;
    transition:background .15s,transform .1s,border-color .15s;
    position:relative;
  }
  .item:active{transform:scale(.96);}
  .item.can{background:rgba(59,151,222,.22);border-color:var(--lblue);}
  .item.locked{opacity:.38;}
  .iName{font-size:12px;font-weight:700;letter-spacing:.5px;}
  .iDesc{font-size:9.5px;color:var(--tint2);margin-top:2px;line-height:1.3;}
  .iCost{
    margin-top:7px;display:inline-block;
    font-size:11px;font-weight:800;color:var(--blue);
    background:var(--white);border-radius:50px;padding:3px 10px;
    font-variant-numeric:tabular-nums;
  }
  .iOwn{
    position:absolute;top:8px;right:10px;font-size:11px;font-weight:800;
    color:var(--tint2);font-variant-numeric:tabular-nums;
  }

  /* ---------- logo ---------- */
  .logo{position:fixed;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));
    width:74px;opacity:.9;pointer-events:none;z-index:5;}

  /* golden orb bonus */
  #golden{
    position:absolute;width:54px;height:54px;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #ffd7ee 0%, var(--magenta) 55%, #7d0050 100%);
    box-shadow:0 0 30px rgba(198,0,126,.8);
    display:none;animation:breathe 1.2s ease-in-out infinite;
    z-index:4;
  }
</style>
</head>
<body>
  <header>
    <div>
      <div class="hTitle">ORB CLICKER</div>
      <div class="hSub">TAP WHILE YOU WAIT</div>
    </div>
    <div class="cps"><b id="cpsVal">0</b>/sec<br><span id="tapVal">1</span>/tap</div>
  </header>

  <div class="scoreWrap">
    <div id="score">0</div>
    <div class="scoreLbl">ORBS COLLECTED</div>
  </div>

  <div class="stage">
    <canvas id="fx"></canvas>
    <div id="orb"></div>
    <div id="golden"></div>
  </div>

  <div class="shop">
    <div class="shopLbl">UPGRADES</div>
    <div class="items" id="items"></div>
  </div>

  <img class="logo" src="assets/novo-logo-white.png" alt="">

<script>
(() => {
'use strict';

/* ---------------- state ---------------- */
const DEFS = [
  {id:'finger',  name:'Extra Finger',   desc:'+1 per tap',        base:15,    tap:1,  cps:0},
  {id:'cursor',  name:'Auto Tapper',    desc:'+1 orb / sec',      base:60,    tap:0,  cps:1},
  {id:'queue',   name:'Queue Buddy',    desc:'+5 orbs / sec',     base:300,   tap:0,  cps:5},
  {id:'kiosk',   name:'Orb Kiosk',      desc:'+20 orbs / sec',    base:1500,  tap:0,  cps:20},
  {id:'factory', name:'Orb Factory',    desc:'+90 orbs / sec',    base:8000,  tap:0,  cps:90},
  {id:'portal',  name:'Orb Portal',     desc:'+400 orbs / sec',   base:42000, tap:0,  cps:400},
];
const SAVE_KEY = 'novo-clicker-v1';

let S = {orbs:0, total:0, owned:{}, mult:1};
try{
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw){ const p = JSON.parse(raw); if(p && typeof p.orbs==='number') S = Object.assign(S, p); }
}catch(e){}
DEFS.forEach(d => { if(!(d.id in S.owned)) S.owned[d.id] = 0; });

const cost   = d => Math.ceil(d.base * Math.pow(1.15, S.owned[d.id]));
const tapPow = () => 1 + DEFS.reduce((a,d)=>a + d.tap*S.owned[d.id], 0);
const cps    = () => DEFS.reduce((a,d)=>a + d.cps*S.owned[d.id], 0);
const fmt    = n => {
  if(n >= 1e9) return (n/1e9).toFixed(1)+'B';
  if(n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if(n >= 1e4) return (n/1e3).toFixed(1)+'K';
  return Math.floor(n).toLocaleString('en-IN');
};

/* ---------------- dom ---------------- */
const $ = id => document.getElementById(id);
const scoreEl = $('score'), cpsEl = $('cpsVal'), tapEl = $('tapVal');
const orb = $('orb'), stage = document.querySelector('.stage');
const itemsEl = $('items'), golden = $('golden');

/* build shop cards once */
const cards = {};
DEFS.forEach(d => {
  const el = document.createElement('div');
  el.className = 'item locked';
  el.innerHTML = `<div class="iOwn" id="own-${d.id}">0</div>
    <div class="iName">${d.name}</div>
    <div class="iDesc">${d.desc}</div>
    <div class="iCost" id="cost-${d.id}"></div>`;
  el.addEventListener('pointerdown', e => { e.preventDefault(); buy(d); });
  itemsEl.appendChild(el);
  cards[d.id] = el;
});

function paint(){
  scoreEl.textContent = fmt(S.orbs);
  cpsEl.textContent = fmt(cps());
  tapEl.textContent = fmt(tapPow());
  DEFS.forEach(d => {
    const c = cost(d);
    $('cost-'+d.id).textContent = fmt(c);
    $('own-'+d.id).textContent = S.owned[d.id];
    cards[d.id].classList.toggle('can', S.orbs >= c);
    cards[d.id].classList.toggle('locked', S.orbs < c && S.owned[d.id] === 0 && S.total < d.base*0.4);
  });
}

/* ---------------- audio ---------------- */
let AC = null;
function beep(f, dur=0.06, gain=0.12, type='sine'){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(gain, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

/* ---------------- particles ---------------- */
const fx = $('fx'), fc = fx.getContext('2d');
let parts = [];
function sizeFx(){
  fx.width = stage.clientWidth * devicePixelRatio;
  fx.height = stage.clientHeight * devicePixelRatio;
  fc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize', sizeFx); sizeFx();

function burst(x, y, n, color){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 60+Math.random()*160;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40, r:2+Math.random()*3, life:1, color});
  }
}

/* ---------------- tap ---------------- */
function floatText(x, y, txt, bonus){
  const f = document.createElement('div');
  f.className = 'float' + (bonus ? ' bonus' : '');
  f.textContent = txt;
  f.style.left = (x-14)+'px'; f.style.top = (y-14)+'px';
  stage.appendChild(f);
  setTimeout(()=>f.remove(), 900);
}

orb.addEventListener('pointerdown', e => {
  e.preventDefault();
  const gain = tapPow() * S.mult;
  S.orbs += gain; S.total += gain;
  const r = stage.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  floatText(x, y, '+'+fmt(gain), S.mult>1);
  burst(x, y, 8, S.mult>1 ? '198,0,126' : '177,213,242');
  orb.classList.add('squish');
  setTimeout(()=>orb.classList.remove('squish'), 80);
  beep(520 + Math.random()*80, .05, .1);
  if(navigator.vibrate) navigator.vibrate(8);
  paint();
});

/* ---------------- buy ---------------- */
function buy(d){
  const c = cost(d);
  if(S.orbs < c){ beep(160, .08, .08, 'square'); return; }
  S.orbs -= c; S.owned[d.id]++;
  beep(740, .07, .12); setTimeout(()=>beep(980, .09, .12), 70);
  if(navigator.vibrate) navigator.vibrate([10,30,10]);
  paint(); save();
}

/* ---------------- golden bonus orb ---------------- */
let goldTimer = 0;
function spawnGolden(){
  const w = stage.clientWidth, h = stage.clientHeight;
  golden.style.left = (30 + Math.random()*(w-120))+'px';
  golden.style.top  = (20 + Math.random()*(h-100))+'px';
  golden.style.display = 'block';
  setTimeout(()=>{ golden.style.display='none'; }, 5000);
}
golden.addEventListener('pointerdown', e => {
  e.preventDefault();
  golden.style.display = 'none';
  S.mult = 5;
  beep(880,.1,.14); setTimeout(()=>beep(1180,.12,.14),90); setTimeout(()=>beep(1480,.16,.14),200);
  const r = stage.getBoundingClientRect();
  floatText(e.clientX-r.left, e.clientY-r.top, 'x5 FRENZY!', true);
  burst(e.clientX-r.left, e.clientY-r.top, 26, '198,0,126');
  setTimeout(()=>{ S.mult = 1; paint(); }, 10000);
  paint();
});

/* ---------------- passive income (wall-clock, survives background/offline) ---------------- */
let lastEarn = Date.now();
function accrue(){
  const now = Date.now();
  let dt = (now - lastEarn)/1000; lastEarn = now;
  if(dt <= 0) return;
  dt = Math.min(dt, 2*3600);           // offline catch-up capped at 2h
  const mult = dt > 1 ? 1 : S.mult;    // frenzy only applies live
  const inc = cps() * mult * dt;
  if(inc > 0){ S.orbs += inc; S.total += inc; }
}
setInterval(() => { accrue(); paint(); }, 1000);   // keeps ticking when rAF is throttled

// offline earnings from last session
if(S.seen && cps() > 0){
  const away = Math.min((Date.now() - S.seen)/1000, 2*3600);
  const gain = cps() * away;
  if(gain > 1){ S.orbs += gain; S.total += gain;
    setTimeout(()=>floatText(stage.clientWidth/2, stage.clientHeight/2, '+'+fmt(gain)+' while away', true), 400);
  }
}

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0, saveAcc = 0;
function frame(now){
  const dt = Math.min((now-last)/1000, 0.25); last = now;

  accrue();
  acc += dt;
  if(acc > 0.2){ paint(); acc = 0; }

  // golden orb schedule (every 25–45s)
  goldTimer -= dt;
  if(goldTimer <= 0){ goldTimer = 25 + Math.random()*20; if(S.total > 50) spawnGolden(); }

  // particles
  fc.clearRect(0,0,fx.width,fx.height);
  parts = parts.filter(p => p.life > 0);
  for(const p of parts){
    p.life -= dt*1.8; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 320*dt;
    fc.globalAlpha = Math.max(p.life, 0);
    fc.fillStyle = `rgb(${p.color})`;
    fc.beginPath(); fc.arc(p.x, p.y, p.r, 0, 7); fc.fill();
  }
  fc.globalAlpha = 1;

  saveAcc += dt;
  if(saveAcc > 5){ save(); saveAcc = 0; }

  requestAnimationFrame(frame);
}
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({orbs:S.orbs, total:S.total, owned:S.owned, mult:1, seen:Date.now()})); }catch(e){}
}
addEventListener('visibilitychange', () => { if(document.hidden) save(); });

paint();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
